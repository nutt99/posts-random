version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ci4_web
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
    environment:
      - CI_ENVIRONMENT=${CI_ENVIRONMENT}
      - database.default.hostname=db
      - database.default.database=${database.default.database}
      - database.default.username=${database.default.username}
      - database.default.password=${database.default.password}
      - database.default.DBDriver=${database.default.DBDriver}
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: ci4_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${database.default.database}
      MYSQL_USER: ${database.default.username}
      MYSQL_PASSWORD: ${database.default.password}
      MYSQL_ROOT_PASSWORD: ${database.default.password}
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: